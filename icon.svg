<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="grad-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Tomato / Timer Body -->
  <circle cx="256" cy="276" r="190" fill="url(#grad-bg)" filter="url(#shadow)"/>

  <!-- Subtle Inner Ring Dial -->
  <circle cx="256" cy="276" r="150" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" opacity="0.3"/>

  <!-- Clock Hands indicating Focus -->
  <line x1="256" y1="276" x2="256" y2="176" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="276" x2="336" y2="276" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="276" r="12" fill="#ffffff"/>

  <!-- Tomato Stem & Leaves -->
  <path d="M256,96 C256,56 270,36 290,26 C280,46 276,66 270,96 Z" fill="#8d6e63"/>
  <path d="M256,96 C220,66 170,80 150,110 C180,115 220,110 256,96 Z" fill="url(#grad-leaf)"/>
  <path d="M256,96 C292,66 342,80 362,110 C332,115 292,110 256,96 Z" fill="url(#grad-leaf)"/>
  <path d="M256,96 C236,126 216,146 196,150 C216,130 240,110 256,96 Z" fill="url(#grad-leaf)" opacity="0.85"/>
  <path d="M256,96 C276,126 296,146 316,150 C296,130 272,110 256,96 Z" fill="url(#grad-leaf)" opacity="0.85"/>
</svg>
